<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>论文正在更新</title>
    <style>
        :root { color-scheme: light dark; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: system-ui, sans-serif; background: #f5f6f8; color: #20242c; }
        main { width: min(100%, 480px); padding: 40px 28px; background: #fff; border: 1px solid #e1e4e9; border-radius: 16px; text-align: center; }
        h1 { font-size: 26px; margin: 0 0 20px; }
        p { line-height: 1.8; color: #555d6a; }
        a { display: inline-block; margin-top: 12px; color: #245cc1; }
        small { display: block; margin-top: 24px; color: #697180; }
        @media (prefers-color-scheme: dark) {
            body { background: #15181e; color: #eef0f4; }
            main { background: #20242c; border-color: #363d49; }
            p, small { color: #bcc3cf; }
            a { color: #9bbdff; }
        }
    </style>
</head>
<body>
    <main>
        <h1>论文正在更新</h1>
        <p>每日 <strong>04:00–05:00</strong> 为数据更新时段，<br>暂不提供论文浏览与查询服务。</p>
        <p>05:00 后恢复访问，请稍后刷新页面。</p>
        <a href="/">刷新页面</a>
        <small>时间以服务器本地时区为准。</small>
    </main>
</body>
</html>
