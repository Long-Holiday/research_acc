<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="aiGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 遥感多光谱扫描波 (Remote Sensing Radar Rings) -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="url(#emeraldGrad)" stroke-width="4" stroke-opacity="0.35" stroke-dasharray="12 10" />
  <circle cx="256" cy="256" r="185" fill="none" stroke="url(#primaryGrad)" stroke-width="5" stroke-opacity="0.5" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#primaryGrad)" stroke-width="4" stroke-opacity="0.75" />

  <!-- 地球主体 (Earth Observation Sphere) -->
  <circle cx="256" cy="256" r="125" fill="url(#primaryGrad)" />
  
  <!-- 经纬网 (Earth Coordinate Grid) -->
  <ellipse cx="256" cy="256" rx="125" ry="46" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.45" />
  <ellipse cx="256" cy="256" rx="58" ry="125" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.45" />
  <line x1="131" y1="256" x2="381" y2="256" stroke="#ffffff" stroke-width="3" stroke-opacity="0.45" />
  <line x1="256" y1="131" x2="256" y2="381" stroke="#ffffff" stroke-width="3" stroke-opacity="0.45" />
  
  <!-- 卫星轨道环 (Satellite Orbital Paths) -->
  <ellipse cx="256" cy="256" rx="205" ry="85" fill="none" stroke="url(#primaryGrad)" stroke-width="12" stroke-linecap="round" transform="rotate(-30 256 256)" />
  <ellipse cx="256" cy="256" rx="205" ry="85" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-dasharray="130 35" transform="rotate(-30 256 256)" />

  <ellipse cx="256" cy="256" rx="205" ry="85" fill="none" stroke="url(#primaryGrad)" stroke-width="9" stroke-linecap="round" transform="rotate(35 256 256)" stroke-opacity="0.85" />

  <!-- 遥感对地观测卫星 (Remote Sensing Satellite) -->
  <g transform="translate(345, 145) rotate(45)">
    <rect x="-38" y="-11" width="25" height="22" rx="3" fill="#10b981" stroke="#ffffff" stroke-width="2" />
    <rect x="13" y="-11" width="25" height="22" rx="3" fill="#10b981" stroke="#ffffff" stroke-width="2" />
    <rect x="-11" y="-15" width="22" height="30" rx="4" fill="#ffffff" stroke="#667eea" stroke-width="3.5" />
    <path d="M-7 15 L0 24 L7 15 Z" fill="url(#goldGrad)" />
    <polygon points="0,24 -40,85 40,85" fill="url(#goldGrad)" fill-opacity="0.28" />
  </g>

  <!-- 顶部 AI 科研星芒 (Radiant AI Star) -->
  <g transform="translate(256, 115)" filter="url(#aiGlow)">
    <path d="M 0 -48 Q 0 0 -48 0 Q 0 0 0 48 Q 0 0 48 0 Q 0 0 0 -48 Z" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="3.5" />
    <circle cx="0" cy="0" r="9" fill="#ffffff" />
  </g>
</svg>